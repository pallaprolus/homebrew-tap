name: Test Homebrew installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
        with:
          stable: true
      - name: Install prebuilt ContextCut
        run: brew install pallaprolus/tap/contextcut
      - name: Test installed formula
        run: brew test pallaprolus/tap/contextcut
      - name: Check CLI
        run: contextcut review --help
